name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  notes:
    name: Extract release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture {
              if (!started && $0 ~ /^[[:space:]]*$/) next
              started=1
              print
            }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG.md section found for version $version. Add a '## [$version]' entry before tagging."
            exit 1
          fi
          echo "----- release notes for $version -----"
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  macos:
    name: Build DMG
    runs-on: macos-15
    needs: notes
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: swift test

      - name: Build app
        run: make app
        env:
          APP_VERSION: ${{ github.ref_name }}

      - name: Package DMG
        run: ./scripts/build-dmg.sh "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/ReviewBot-*.dmg

  windows:
    name: Build Windows zip
    runs-on: windows-latest
    needs: notes
    steps:
      - uses: actions/checkout@v5

      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE

      - name: Run tests
        run: swift test

      - name: Build and package
        run: pwsh scripts/build-windows.ps1
        env:
          APP_VERSION: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ReviewBot-*-windows-x64.zip

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [notes, macos, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/macos/ReviewBot-*.dmg
            artifacts/windows/ReviewBot-*-windows-x64.zip
          body_path: artifacts/release-notes/release-notes.md
          fail_on_unmatched_files: true
